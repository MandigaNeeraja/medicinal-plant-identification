# Render Blueprint — Medicinal Plant Identification
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: medicinal-plant-db
    plan: free
    databaseName: medicinal_plant
    user: medicinal_plant

services:
  # Flask REST API
  - type: web
    name: medicinal-plant-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 180 backend.wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: medicinal-plant-db
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          type: web
          name: medicinal-plant-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: medicinal-plant-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  # React static frontend
  - type: web
    name: medicinal-plant-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: medicinal-plant-api
          envVarKey: RENDER_EXTERNAL_URL
